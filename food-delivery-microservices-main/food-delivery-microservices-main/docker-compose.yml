services:

  restaurant-service:
    build: ./restaurant-service
    container_name: restaurant-service
    ports:
      - "5000:5000"
    networks:
      - food-delivery-network

  delivery-service:
    build: ./delivery-service
    container_name: delivery-service
    ports:
      - "5001:5001"
    networks:
      - food-delivery-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5002:5002"
    networks:
      - food-delivery-network

networks:
  food-delivery-network:
    driver: bridge